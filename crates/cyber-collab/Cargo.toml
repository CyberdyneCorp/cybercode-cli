[package]
name = "cyber-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-account = { path = "../cyber-account" }
cyber-core.workspace = true
cyber-store.workspace = true
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
crossbeam-channel.workspace = true
futures = "0.3"
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
reqwest = { version = "0.13", features = ["json", "form", "stream"] }
rusqlite.workspace = true
schemars = "1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = "0.26"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2"
tempfile.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time"] }
tokio-util = "0.7"
ulid.workspace = true
url = "2"
zeroize = "1"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
aws-lc-rs = "1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[lints]
workspace = true
