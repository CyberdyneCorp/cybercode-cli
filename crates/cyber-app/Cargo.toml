[package]
name = "cyber-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
cyber-server = { path = "../cyber-server" }
cyber-tools = { path = "../cyber-tools" }
cyber-sandbox = { path = "../cyber-sandbox" }
cyber-snapshot = { path = "../cyber-snapshot" }
axum = "0.8"
base64 = "0.22"
futures = "0.3"
tokio-util = "0.7"
getrandom = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros", "process", "fs", "io-std", "io-util"] }
ulid.workspace = true

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio-tungstenite = "0.28"
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "process", "fs", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
