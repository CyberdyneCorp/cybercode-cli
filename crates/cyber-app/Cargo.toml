[package]
name = "cyber-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-install = { path = "../cyber-install" }
cyber-llm = { path = "../cyber-llm" }
cyber-server = { path = "../cyber-server" }
cyber-tools = { path = "../cyber-tools" }
cyber-workflow = { path = "../cyber-workflow" }
cyber-sandbox = { path = "../cyber-sandbox" }
cyber-snapshot = { path = "../cyber-snapshot" }
axum = "0.8"
base64 = "0.22"
futures = "0.3"
tokio-util = "0.7"
getrandom = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
sha2.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros", "process", "fs", "io-std", "io-util"] }
ulid.workspace = true
mdns-sd = { version = "0.21", default-features = false }
url = "2"

[dev-dependencies]
cyber-client = { path = "../cyber-client" }
cyber-install = { path = "../cyber-install", features = ["test-support"] }
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
rusqlite.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio-tungstenite = "0.28"
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "process", "fs", "test-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(windows)'.dev-dependencies]
cap-std = "4.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true
