[package]
name = "cyber-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
cyber-server = { path = "../cyber-server" }
cyber-tools = { path = "../cyber-tools" }
cyber-sandbox = { path = "../cyber-sandbox" }
cyber-snapshot = { path = "../cyber-snapshot" }
axum = "0.8"
base64 = "0.22"
futures = "0.3"
tokio-util = "0.7"
getrandom = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "net", "time", "signal", "sync", "macros", "process", "fs", "io-std", "io-util"] }
ulid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros", "process", "fs"] }

[lints]
workspace = true
