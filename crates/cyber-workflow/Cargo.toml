[package]
name = "cyber-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Sandboxed QuickJS engine, module format and discovery for Cyber Code Workflows"

[dependencies]
# Pinned exactly: the embedded engine is a security boundary (`workflows` → Sandboxed
# QuickJS runtime). MIT; quickjs-ng sources are compiled through `cc` with pre-generated
# bindings, so no libclang is needed on any release target.
rquickjs = { version = "=0.14.0", default-features = false, features = ["std"] }
futures = "0.3"
schemars = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
