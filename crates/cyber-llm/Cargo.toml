[package]
name = "cyber-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
schemars = "1"
base64 = "0.22"
cyber-core.workspace = true
bytes = "1"
flate2 = "1"
futures = "0.3"
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
reqwest = { version = "0.13", features = ["json", "stream", "form"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
