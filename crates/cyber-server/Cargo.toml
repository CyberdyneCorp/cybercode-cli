[package]
name = "cyber-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-account = { path = "../cyber-account" }
cyber-collab = { path = "../cyber-collab" }
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
cyber-workflow = { path = "../cyber-workflow" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Local days in IANA zones: reads the system tz database, bundled on Windows.
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
futures = "0.3"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs", "io-util", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd"] }
schemars = "1"
base64 = "0.22"
getrandom = "0.3"
http-body-util = "0.1"
jsonschema = { version = "0.58.6", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# Machine stats for `GET /system`: CPU, memory and one disk only, never processes.
# 0.38 keeps the workspace MSRV (0.39 needs Rust 1.95).
sysinfo = { version = "=0.38.4", default-features = false, features = ["system", "disk"] }
# The peer listener (`server-api` → Peer listener): a self-signed ECDSA P-256 identity served
# with TLS 1.3, on the aws-lc-rs provider reqwest already uses.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc"] }
# The peer client: requests to other servers' peer listeners over the pinned-key TLS above.
reqwest = { version = "0.13", features = ["json"] }
url = "2"

[target.'cfg(unix)'.dependencies]
# `statvfs` of the Location itself for `GET /system`'s disk (already in the tree).
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
cap-std = "4.0"
tempfile.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
cyber-llm = { path = "../cyber-llm" }
base64 = "0.22"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "test-util"] }
tokio-util = "0.7"
futures = "0.3"
cyber-workflow = { path = "../cyber-workflow" }

[lints]
workspace = true
