[package]
name = "cyber-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
cyber-workflow = { path = "../cyber-workflow" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Local days in IANA zones: reads the system tz database, bundled on Windows.
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
futures = "0.3"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net", "fs", "io-util", "signal"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-zstd"] }
schemars = "1"
base64 = "0.22"
getrandom = "0.3"
http-body-util = "0.1"
jsonschema = { version = "0.58.6", default-features = false }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }

[dev-dependencies]
cap-std = "4.0"
tempfile.workspace = true
reqwest = { version = "0.13", features = ["json", "stream"] }
http-body-util = "0.1"
tokio-tungstenite = "0.28"
cyber-llm = { path = "../cyber-llm" }
base64 = "0.22"
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = "0.7"
futures = "0.3"
cyber-workflow = { path = "../cyber-workflow" }

[lints]
workspace = true
