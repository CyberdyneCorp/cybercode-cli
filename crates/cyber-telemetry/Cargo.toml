[package]
name = "cyber-telemetry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# OTLP over gRPC. Without it a `grpc` protocol keeps export off.
otlp-grpc = ["dep:http", "opentelemetry-otlp/grpc-tonic", "opentelemetry-otlp/tls-aws-lc", "opentelemetry-otlp/tls-roots"]

[dependencies]
cyber-core.workspace = true
cyber-server = { path = "../cyber-server" }
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
url = "2"
reqwest = "0.13"
http = { version = "1", optional = true }
# Exact pins: the SDK's async-runtime processor API is still experimental upstream.
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_periodicreader_with_async_runtime",
    "experimental_logs_batch_log_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "http-proto", "http-json", "reqwest-client"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio", "testing"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
