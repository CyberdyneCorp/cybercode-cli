[package]
name = "cyber-snapshot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
cyber-core.workspace = true
cyber-server = { path = "../cyber-server" }
futures = "0.3"
serde_json.workspace = true
sha1 = "0.10"
sha2.workspace = true
serde.workspace = true
blake3 = "1"
diffy = "0.4"
similar = "3.2"
ignore = "0.4"
cap-std = "4.0"
cap-fs-ext = "4.0"

tokio = { version = "1", features = ["rt", "process", "time", "sync", "fs", "macros", "io-util"] }
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
tempfile.workspace = true
rustix = { version = "=1.1.5", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "sync", "fs", "macros"] }

[lints]
workspace = true
