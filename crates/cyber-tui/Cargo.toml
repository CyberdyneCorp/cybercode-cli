[package]
name = "cyber-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Inline clipboard and peer attachments in prompt parts.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Budget reset times in the server's IANA zone.
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
cyber-core.workspace = true
cyber-client = { path = "../cyber-client" }
cyber-server = { path = "../cyber-server" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
# `line_count` places the click targets of wrapped prompt rows.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
serde.workspace = true
serde_json.workspace = true
# Verify bounded binary pages; tests also pin synthesized alert sounds.
sha2.workspace = true
jsonschema = { version = "0.58.6", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "signal"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
cyber-app = { path = "../cyber-app" }
cyber-store = { path = "../cyber-store" }
insta = { version = "=1.47.0", default-features = false }
rusqlite.workspace = true
tempfile.workspace = true

cyber-account = { path = "../cyber-account" }
cyber-collab = { path = "../cyber-collab" }
aws-lc-rs = "1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
axum = { version = "0.8", features = ["macros"] }
reqwest = { version = "0.13", features = ["json"] }

[lints]
workspace = true
