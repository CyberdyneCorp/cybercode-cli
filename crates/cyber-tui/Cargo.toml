[package]
name = "cyber-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Budget reset times in the server's IANA zone.
jiff = { version = "=0.2.15", default-features = false, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
cyber-core.workspace = true
cyber-client = { path = "../cyber-client" }
cyber-server = { path = "../cyber-server" }
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
pulldown-cmark = { version = "=0.13.4", default-features = false }
ratatui = "0.30"
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.58.6", default-features = false }
syntect = { version = "=5.3.0", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
two-face = { version = "=0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
cyber-app = { path = "../cyber-app" }
cyber-store = { path = "../cyber-store" }
insta = { version = "=1.47.0", default-features = false }
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
