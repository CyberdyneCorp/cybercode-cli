[package]
name = "cyber-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "time", "macros", "io-std", "io-util"] }
cyber-app = { path = "../cyber-app" }
cyber-client = { path = "../cyber-client" }
cyber-tui = { path = "../cyber-tui" }
cyber-tools = { path = "../cyber-tools" }
cyber-workflow = { path = "../cyber-workflow" }
tokio-util = "0.7"
cyber-sandbox = { path = "../cyber-sandbox" }
rusqlite.workspace = true
cyber-server = { path = "../cyber-server" }
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.13", features = ["json"] }
ulid.workspace = true
sha2.workspace = true
clap.workspace = true
crossterm = "0.29"
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true

cap-std = "4.0"
cap-fs-ext = "4.0"
shell-words = "1.1"
libc = "0.2"
tempfile.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
url = "2"
mdns-sd = { version = "0.21", default-features = false }
axum = "0.8"
rusqlite.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
