[package]
name = "cyber-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cyber"
path = "src/main.rs"

[dependencies]
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "time", "macros", "io-std", "io-util"] }
cyber-app = { path = "../cyber-app" }
cyber-client = { path = "../cyber-client" }
cyber-tui = { path = "../cyber-tui" }
cyber-tools = { path = "../cyber-tools" }
tokio-util = "0.7"
cyber-sandbox = { path = "../cyber-sandbox" }
rusqlite.workspace = true
cyber-server = { path = "../cyber-server" }
base64 = "0.22"
futures = "0.3"
ulid.workspace = true
sha2.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true

cap-std = "4.0"
cap-fs-ext = "4.0"
shell-words = "1.1"
libc = "0.2"
tempfile.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
