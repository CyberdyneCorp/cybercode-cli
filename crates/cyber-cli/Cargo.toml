[package]
name = "cyber-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "cyber"
path = "src/main.rs"

[features]
default = ["otlp-grpc"]
# OTLP export over gRPC (`telemetry.otel.protocol: grpc`).
otlp-grpc = ["cyber-telemetry/otlp-grpc"]

[dependencies]
cyber-collab = { path = "../cyber-collab" }
url = "2"
cyber-account = { path = "../cyber-account" }
cyber-core.workspace = true
cyber-store.workspace = true
cyber-llm = { path = "../cyber-llm" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "signal", "time", "macros", "io-std", "io-util"] }
cyber-app = { path = "../cyber-app" }
cyber-client = { path = "../cyber-client" }
cyber-tui = { path = "../cyber-tui" }
cyber-tools = { path = "../cyber-tools" }
cyber-workflow = { path = "../cyber-workflow" }
cyber-install = { path = "../cyber-install" }
semver = "1"
tokio-util = "0.7"
cyber-sandbox = { path = "../cyber-sandbox" }
rusqlite.workspace = true
cyber-server = { path = "../cyber-server" }
cyber-telemetry = { path = "../cyber-telemetry" }
base64 = "0.22"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
ulid.workspace = true
sha2.workspace = true
clap.workspace = true
crossterm = "0.29"
serde.workspace = true
serde_json.workspace = true
strsim.workspace = true

cap-std = "4.0"
cap-fs-ext = "4.0"
shell-words = "1.1"
libc = "0.2"
tempfile.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
cyber-install = { path = "../cyber-install", features = ["test-support"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
aws-lc-rs = "1"
jsonwebtoken = { version = "=10.3.0", default-features = false, features = ["aws_lc_rs"] }
url = "2"
mdns-sd = { version = "0.21", default-features = false }
axum = "0.8"
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic", "trace", "metrics"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
tokio-stream = { version = "0.1", features = ["net"] }
rusqlite.workspace = true
tempfile.workspace = true
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "macros", "sync", "process", "io-util"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
