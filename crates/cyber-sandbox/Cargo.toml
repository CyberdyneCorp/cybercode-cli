[package]
name = "cyber-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Ordinary AppContainer launch is retained solely for native permission controls.
windows-test-controls = []

[dependencies]
git2 = { version = "0.21.0", default-features = false }
tempfile.workspace = true
cyber-core.workspace = true
futures = "0.3"
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Networking_WinSock", "Win32_Globalization", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "process"] }

[lints]
workspace = true
