[package]
name = "cyber-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
git2 = { version = "0.21.0", default-features = false }
cap-std = "4.0"
cap-fs-ext = "4.0"
ignore = "0.4"
globset = "0.4"
regex = "1"
url = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
sha2.workspace = true
shell-words = "1.1"
similar = "3.2"
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
thiserror.workspace = true
ulid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
futures = "0.3"
tempfile.workspace = true

[lints]
workspace = true
