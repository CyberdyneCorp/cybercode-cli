name: Linux plugin IPC diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/cyber-sandbox/examples/plugin_unix_socket_probe.rs
      - crates/cyber-sandbox/tests/fixtures/plugin_unix_socket.c
      - .github/workflows/plugin-linux-ipc.yml
      - scripts/probes/plugin-native-entry/linux_socket_candidate.h
      - scripts/probes/plugin-native-entry/build_socket_candidate.py
      - scripts/probes/plugin-native-entry/linux_socket_landlock9.h
      - scripts/probes/plugin-native-entry/linux_unix9_policy.h
permissions:
  contents: read
concurrency:
  group: plugin-linux-ipc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ipc:
    name: UNIX socket diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.8'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential pkg-config cmake strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build production helper and diagnostic
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec --example plugin_unix_socket_probe
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-candidate"
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/unix9-candidate" landlock9
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/unix9-missing-resolve" landlock9-no-resolve
      - name: Observe fixture-only host socket reachability
        shell: bash
        run: |
          set -euo pipefail
          target/debug/examples/plugin_unix_socket_probe "$PWD/target/debug/cyber-sandbox-exec" "$RUNNER_TEMP/linux-ipc.json"
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-candidate" "$RUNNER_TEMP/linux-ipc-candidate.json" --candidate
      - name: Record pathname policy kernel availability
        id: abi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          source = json.loads((Path(os.environ['RUNNER_TEMP']) / 'linux-ipc.json').read_text())
          observed = {row['observed']['landlock_abi'] for row in source['rows']}
          assert len(observed) == 1
          abi = observed.pop()
          assert isinstance(abi, int) and abi >= 3
          supported = abi >= 9
          report = {'required_abi': 9, 'observed_abi': abi, 'available': supported,
              'acceptance': 'pending native checks' if supported else 'unverified; kernel unsupported',
              'checkout': source['checkout'], 'run_id': source['run_id'],
              'source_sha256': source['source_sha256'],
              'scope': 'Kernel availability only; refusal on an older kernel is not confinement acceptance.'}
          (Path(os.environ['RUNNER_TEMP']) / 'linux-ipc-unix9-availability.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('supported=' + str(supported).lower() + '\n')
          print(json.dumps(report))
          PY
      - name: Verify pathname policy on a capable kernel
        if: steps.abi.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-candidate" "$RUNNER_TEMP/linux-ipc-unix9.json" --landlock9
      - name: Verify explicit refusal on an older kernel
        if: steps.abi.outputs.supported == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-candidate" "$RUNNER_TEMP/linux-ipc-unix9.json" --landlock9 > "$RUNNER_TEMP/unix9-unavailable.log" 2>&1; then
            echo 'Unsupported kernel unexpectedly admitted the ABI-9 candidate' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/unix9-unavailable.log" "$RUNNER_TEMP/linux-ipc-unix9-availability.json" <<'PY'
          from pathlib import Path
          import json, sys
          text = Path(sys.argv[1]).read_text()
          abi = json.loads(Path(sys.argv[2]).read_text())['observed_abi']
          assert f'requires Landlock ABI >= 9 (observed {abi})' in text, text
          assert 'fixture bootstrap failed' in text, text
          print('UNVERIFIED: ABI-9 confinement and runtime acceptance require a capable kernel.')
          PY
      - name: Verify pathname policy counterexample control
        if: steps.abi.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-missing-resolve" "$RUNNER_TEMP/linux-ipc-unix9-control.json" --landlock9 > "$RUNNER_TEMP/unix9-missing-resolve.log" 2>&1; then
            cat "$RUNNER_TEMP/unix9-missing-resolve.log"
            echo 'Missing pathname policy unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/unix9-missing-resolve.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'socket denial: outside:' in text, text
          assert '"connected":true' in text and '"sent":true' in text, text
          PY
      - name: Verify candidate runtime compatibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/socket-runtime"
          status=0
          for policy in seccomp unix9; do
            if [[ "$policy" == unix9 && '${{ steps.abi.outputs.supported }}' != true ]]; then
              echo 'UNVERIFIED: skipping ABI-9 runtime matrix on this unsupported kernel.'
              continue
            fi
            mkdir -p "$RUNNER_TEMP/socket-runtime/$policy"
            helper="$RUNNER_TEMP/socket-candidate"
            if [[ "$policy" == unix9 ]]; then helper="$RUNNER_TEMP/unix9-candidate"; fi
            for runtime in node python bun deno native; do
            args=(--runtime "$runtime" --initial-exec --packaged-helper "$helper" --report "$RUNNER_TEMP/socket-runtime/$policy/$runtime.json" --trace "$RUNNER_TEMP/socket-runtime/$policy/trace-$runtime")
            if [[ "$policy" == unix9 ]]; then args+=(--unix-scratch-policy); fi
            if [[ "$runtime" == python ]]; then
              args+=(--python "$(command -v python3)")
            elif [[ "$runtime" == bun || "$runtime" == deno ]]; then
              args+=(--executable "$(command -v "$runtime")")
            fi
            if ! node --experimental-strip-types scripts/probes/plugin-confinement/run.mts "${args[@]}" > "$RUNNER_TEMP/socket-runtime/$policy/$runtime.log" 2>&1; then
              cat "$RUNNER_TEMP/socket-runtime/$policy/$runtime.log"
              status=1
            fi
          done
          done
          exit "$status"
      - name: Retain diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ipc-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/linux-ipc*.json
            ${{ runner.temp }}/socket-runtime/
            ${{ runner.temp }}/unix9-missing-resolve.log
            ${{ runner.temp }}/unix9-unavailable.log
          if-no-files-found: warn
          retention-days: 14
