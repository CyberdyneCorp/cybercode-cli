name: Linux plugin IPC diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/cyber-sandbox/examples/plugin_unix_socket_probe.rs
      - crates/cyber-sandbox/tests/fixtures/plugin_unix_socket.c
      - crates/cyber-sandbox/tests/fixtures/plugin_socket_cancel.h
      - crates/cyber-sandbox/tests/fixtures/plugin_socket_mutation.h
      - crates/cyber-sandbox/tests/fixtures/plugin_unix_mutation.h
      - crates/cyber-sandbox/tests/fixtures/plugin_process_escape.h
      - crates/cyber-sandbox/tests/fixtures/plugin_socket_saturation.h
      - crates/cyber-sandbox/examples/support/plugin_socket_cancel.rs
      - crates/cyber-sandbox/native/**
      - crates/cyber-sandbox/src/plugin_policy.rs
      - crates/cyber-sandbox/src/plugin_policy/**
      - scripts/probes/plugin-confinement/**
      - .github/workflows/plugin-linux-ipc.yml
      - scripts/probes/plugin-native-entry/linux_socket_candidate.h
      - scripts/probes/plugin-native-entry/linux_socket_broker.h
      - scripts/probes/plugin-native-entry/linux_socket_private_stream.h
      - scripts/probes/plugin-native-entry/linux_socket_private_unix.h
      - scripts/probes/plugin-native-entry/linux_socket_broker_mutation.h
      - scripts/probes/plugin-native-entry/build_socket_candidate.py
      - scripts/probes/plugin-native-entry/linux_socket_landlock9.h
      - scripts/probes/plugin-native-entry/linux_unix9_policy.h
      - scripts/probes/plugin-native-entry/linux_pidfd_probe.c
      - scripts/probes/plugin-native-entry/pidfd.mts
      - scripts/probes/plugin-native-entry/linux_unix_endpoint_pin.c
      - scripts/probes/plugin-native-entry/unix-endpoint.mts
permissions:
  contents: read
concurrency:
  group: plugin-linux-ipc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ipc:
    name: UNIX socket diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.9.8'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y bubblewrap build-essential pkg-config cmake strace
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Observe descriptor-pinning prerequisites
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -Werror -pthread scripts/probes/plugin-native-entry/linux_pidfd_probe.c -o "$RUNNER_TEMP/pidfd-probe"
          node --experimental-strip-types scripts/probes/plugin-native-entry/pidfd.mts --probe "$RUNNER_TEMP/pidfd-probe" --report "$RUNNER_TEMP/linux-pidfd.json"
      - name: Observe pinned private UNIX endpoint identity
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -Werror scripts/probes/plugin-native-entry/linux_unix_endpoint_pin.c -o "$RUNNER_TEMP/unix-endpoint-pin"
          node --experimental-strip-types scripts/probes/plugin-native-entry/unix-endpoint.mts --probe "$RUNNER_TEMP/unix-endpoint-pin" --report "$RUNNER_TEMP/linux-unix-endpoint.json"
      - name: Retain UNIX endpoint identity observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-unix-endpoint-${{ matrix.os }}
          path: ${{ runner.temp }}/linux-unix-endpoint.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain descriptor prerequisite observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-pidfd-${{ matrix.os }}
          path: ${{ runner.temp }}/linux-pidfd.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build production helper and diagnostic
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-candidate"
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker" broker
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-no-bind" broker-no-bind
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-no-thread" broker-no-thread
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-audit" broker-audit
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-no-cancel" broker-audit-no-cancel
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-wrong-cap" broker-audit-wrong-cap
          for variant in broker-private-stream broker-private-stream-no-makesock broker-private-stream-no-refer broker-private-stream-mutation broker-private-stream-mutation-no-endpoint; do
            python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/$variant" "$variant"
          done
          for mode in mutation mutation-no-pin mutation-no-copy mutation-continue; do
            python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/socket-broker-$mode" "broker-$mode"
          done
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/unix9-candidate" landlock9
          python3 scripts/probes/plugin-native-entry/build_socket_candidate.py "$RUNNER_TEMP/unix9-missing-resolve" landlock9-no-resolve
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec --example plugin_unix_socket_probe
      - name: Observe fixture-only host socket reachability
        shell: bash
        run: |
          set -euo pipefail
          target/debug/examples/plugin_unix_socket_probe "$PWD/target/debug/cyber-sandbox-exec" "$RUNNER_TEMP/linux-ipc.json"
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-candidate" "$RUNNER_TEMP/linux-ipc-candidate.json" --candidate
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker" "$RUNNER_TEMP/linux-ipc-broker.json" --broker
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-audit" "$RUNNER_TEMP/linux-ipc-broker-cancel.json" --broker-cancel
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-mutation" "$RUNNER_TEMP/linux-ipc-broker-mutation.json" --broker-mutation
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker" "$RUNNER_TEMP/linux-ipc-broker-escape.json" --broker-escape
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-audit" "$RUNNER_TEMP/linux-ipc-broker-saturation.json" --broker-saturation
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/broker-private-stream" "$RUNNER_TEMP/linux-ipc-broker-private-stream.json" --broker-private-stream
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/broker-private-stream-mutation" "$RUNNER_TEMP/linux-ipc-broker-private-stream-mutation.json" --broker-private-stream-mutation
      - name: Reject pathname re-resolution after private endpoint pinning
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/private-stream-no-endpoint.log"
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/broker-private-stream-mutation-no-endpoint" "$RUNNER_TEMP/linux-ipc-private-no-endpoint.json" --broker-private-stream-mutation > "$log" 2>&1; then
            echo 'Missing private endpoint pin unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'private UNIX mutation escaped the pinned endpoint' in text, text
          for token in ['"fd_replaced":true', '"address_changed":true', '"path_replaced":true',
                        '"original_unlinked":true', '"result_ok":true', '"sent":true',
                        '"private_roundtrip":false', '"host_received_fixture":true', 'BPIN ']:
              assert token in text, text
          PY
      - name: Reject missing private socket creation and file-move compatibility guards
        shell: bash
        run: |
          set -euo pipefail
          for control in no-makesock no-refer; do
            log="$RUNNER_TEMP/broker-private-stream-$control.log"
            if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/broker-private-stream-$control" "$RUNNER_TEMP/linux-ipc-private-stream-$control.json" --broker-private-stream > "$log" 2>&1; then
              echo "Private stream control unexpectedly passed: $control" >&2
              exit 1
            fi
            python3 - "$log" "$control" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          if sys.argv[2] == 'no-makesock':
              assert 'private pair escape: pair_bind: public read=false write=true' in text, text
              assert '"pair_bind":true' in text, text
          else:
              assert 'private IPC layer changed ordinary file moves:' in text, text
              assert 'write=true' in text and '"regular_reparent":false' in text, text
          PY
          done
      - name: Reject blanket bind denial as broker acceptance
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-no-bind" "$RUNNER_TEMP/linux-ipc-broker-control.json" --broker > "$RUNNER_TEMP/broker-no-bind.log" 2>&1; then
            echo 'Missing IP server capability unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/broker-no-bind.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'IP server/client token exchange' in text, text
          assert '"tcp_roundtrip":false' in text, text
          PY
      - name: Reject missing thread-specific descriptor ownership
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-no-thread" "$RUNNER_TEMP/linux-ipc-broker-thread-control.json" --broker > "$RUNNER_TEMP/broker-no-thread.log" 2>&1; then
            echo 'Missing thread-specific pidfd unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/broker-no-thread.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'thread-local IP descriptor token exchange' in text, text
          assert '"tcp_roundtrip":true' in text and '"thread_tcp_roundtrip":false' in text, text
          PY
      - name: Reject missing cancelled-worker termination
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-no-cancel" "$RUNNER_TEMP/linux-ipc-broker-cancel-control.json" --broker-cancel > "$RUNNER_TEMP/broker-no-cancel.log" 2>&1; then
            echo 'Missing cancelled-worker termination unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/broker-no-cancel.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'cancelled socket worker was not reaped' in text, text
          assert '"client_syn_sent":true' in text and '"cancelled":true' in text, text
          assert 'BCANCEL ' in text, text
          PY
      - name: Reject descriptor and address re-resolution controls
        shell: bash
        run: |
          set -euo pipefail
          for control in no-pin no-copy continue; do
            log="$RUNNER_TEMP/broker-mutation-$control.log"
            if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-mutation-$control" "$RUNNER_TEMP/linux-ipc-broker-mutation-$control.json" --broker-mutation > "$log" 2>&1; then
              echo "Missing mutation safeguard unexpectedly passed: $control" >&2
              exit 1
            fi
            python3 - "$log" "$control" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'socket/address mutation changed the admitted operation' in text, text
          for token in ['"fd_replaced":true', '"address_changed":true', '"result_ok":false', 'BPIN ']:
              assert token in text, text
          if sys.argv[2] == 'continue':
              assert '"bound_original":true' in text, text
          else:
              assert '"bound_original":false' in text, text
          PY
          done
      - name: Reject missing private PID namespace settlement
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker" "$RUNNER_TEMP/linux-ipc-broker-escape-control.json" --broker-escape-no-pid > "$RUNNER_TEMP/broker-no-pid.log" 2>&1; then
            echo 'Missing private PID namespace unexpectedly settled the escaped descendant' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/broker-no-pid.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'escaped descendant retained stdout after namespace owner exited' in text, text
          for token in ['"escaped_session":true', '"controlled_stdin":true', '"stdout_closed_before_cleanup":false', '"owner_exited_before_cleanup":true']:
              assert token in text, text
          PY
      - name: Reject an over-capacity socket worker pool
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/socket-broker-wrong-cap" "$RUNNER_TEMP/linux-ipc-broker-capacity-control.json" --broker-saturation > "$RUNNER_TEMP/broker-wrong-cap.log" 2>&1; then
            echo 'Wrong socket worker limit unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/broker-wrong-cap.log" <<'PY'
          from pathlib import Path
          import json, sys
          text = Path(sys.argv[1]).read_text()
          marker = 'socket-worker cap did not backpressure: '
          assert marker in text, text
          receipt = json.loads(text.split(marker, 1)[1].splitlines()[0])
          assert receipt['ready']['setup_complete'] is True, receipt
          assert receipt['pressure']['blocked_count'] == 16, receipt
          assert len(receipt['started']) == 20, receipt
          assert receipt['pressure_cancelled'] is None, receipt
          PY
      - name: Record pathname policy kernel availability
        id: abi
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          source = json.loads((Path(os.environ['RUNNER_TEMP']) / 'linux-ipc.json').read_text())
          observed = {row['observed']['landlock_abi'] for row in source['rows']}
          assert len(observed) == 1
          abi = observed.pop()
          assert isinstance(abi, int) and abi >= 3
          supported = abi >= 9
          report = {'required_abi': 9, 'observed_abi': abi, 'available': supported,
              'acceptance': 'pending native checks' if supported else 'unverified; kernel unsupported',
              'checkout': source['checkout'], 'run_id': source['run_id'],
              'source_sha256': source['source_sha256'],
              'scope': 'Kernel availability only; refusal on an older kernel is not confinement acceptance.'}
          (Path(os.environ['RUNNER_TEMP']) / 'linux-ipc-unix9-availability.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('supported=' + str(supported).lower() + '\n')
          print(json.dumps(report))
          PY
      - name: Verify pathname policy on a capable kernel
        if: steps.abi.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-candidate" "$RUNNER_TEMP/linux-ipc-unix9.json" --landlock9
      - name: Verify explicit refusal on an older kernel
        if: steps.abi.outputs.supported == 'false'
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-candidate" "$RUNNER_TEMP/linux-ipc-unix9.json" --landlock9 > "$RUNNER_TEMP/unix9-unavailable.log" 2>&1; then
            echo 'Unsupported kernel unexpectedly admitted the ABI-9 candidate' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/unix9-unavailable.log" "$RUNNER_TEMP/linux-ipc-unix9-availability.json" <<'PY'
          from pathlib import Path
          import json, sys
          text = Path(sys.argv[1]).read_text()
          abi = json.loads(Path(sys.argv[2]).read_text())['observed_abi']
          assert f'requires Landlock ABI >= 9 (observed {abi})' in text, text
          assert 'fixture bootstrap failed' in text, text
          print('UNVERIFIED: ABI-9 confinement and runtime acceptance require a capable kernel.')
          PY
      - name: Verify pathname policy counterexample control
        if: steps.abi.outputs.supported == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if target/debug/examples/plugin_unix_socket_probe "$RUNNER_TEMP/unix9-missing-resolve" "$RUNNER_TEMP/linux-ipc-unix9-control.json" --landlock9 > "$RUNNER_TEMP/unix9-missing-resolve.log" 2>&1; then
            cat "$RUNNER_TEMP/unix9-missing-resolve.log"
            echo 'Missing pathname policy unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/unix9-missing-resolve.log" <<'PY'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'socket denial: outside:' in text, text
          assert '"connected":true' in text and '"sent":true' in text, text
          PY
      - name: Verify candidate runtime compatibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/socket-runtime"
          status=0
          for policy in seccomp broker private-stream unix9; do
            if [[ "$policy" == unix9 && '${{ steps.abi.outputs.supported }}' != true ]]; then
              echo 'UNVERIFIED: skipping ABI-9 runtime matrix on this unsupported kernel.'
              continue
            fi
            mkdir -p "$RUNNER_TEMP/socket-runtime/$policy"
            helper="$RUNNER_TEMP/socket-candidate"
            if [[ "$policy" == broker ]]; then helper="$RUNNER_TEMP/socket-broker"; fi
            if [[ "$policy" == private-stream ]]; then helper="$RUNNER_TEMP/broker-private-stream"; fi
            if [[ "$policy" == unix9 ]]; then helper="$RUNNER_TEMP/unix9-candidate"; fi
            for runtime in node python bun deno native; do
            args=(--runtime "$runtime" --initial-exec --packaged-helper "$helper" --report "$RUNNER_TEMP/socket-runtime/$policy/$runtime.json" --trace "$RUNNER_TEMP/socket-runtime/$policy/trace-$runtime")
            if [[ "$policy" == broker ]]; then args+=(--socket-broker); fi
            if [[ "$policy" == private-stream ]]; then args+=(--socket-broker --broker-private-stream); fi
            if [[ "$policy" == unix9 ]]; then args+=(--unix-scratch-policy); fi
            if [[ "$runtime" == python ]]; then
              args+=(--python "$(command -v python3)")
            elif [[ "$runtime" == bun || "$runtime" == deno ]]; then
              args+=(--executable "$(command -v "$runtime")")
            fi
            if ! node --experimental-strip-types scripts/probes/plugin-confinement/run.mts "${args[@]}" > "$RUNNER_TEMP/socket-runtime/$policy/$runtime.log" 2>&1; then
              cat "$RUNNER_TEMP/socket-runtime/$policy/$runtime.log"
              status=1
            fi
          done
          done
          exit "$status"
      - name: Retain diagnostic observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-ipc-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/linux-ipc*.json
            ${{ runner.temp }}/socket-runtime/
            ${{ runner.temp }}/unix9-missing-resolve.log
            ${{ runner.temp }}/unix9-unavailable.log
            ${{ runner.temp }}/broker-no-bind.log
            ${{ runner.temp }}/broker-private-stream-no-makesock.log
            ${{ runner.temp }}/broker-private-stream-no-refer.log
            ${{ runner.temp }}/private-stream-no-endpoint.log
            ${{ runner.temp }}/broker-no-thread.log
            ${{ runner.temp }}/broker-no-cancel.log
            ${{ runner.temp }}/broker-mutation-*.log
            ${{ runner.temp }}/broker-no-pid.log
            ${{ runner.temp }}/broker-wrong-cap.log
          if-no-files-found: warn
          retention-days: 14
