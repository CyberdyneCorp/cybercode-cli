name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated sources match sdk/openapi.json
        run: python3 ../../scripts/generate_sdk.py --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @fission-ai/openspec@latest
      - run: openspec validate --all --strict
      - run: python3 scripts/spec_lint.py
      - name: Evaluation graders fail the fixtures and pass the reference solutions
        run: python3 scripts/check_eval_graders.py --jobs 4
      - name: Requirement inventory is current
        run: python3 scripts/spec_inventory.py && git diff --exit-code ROADMAP.md

  platforms:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Native C build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-musl')
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build workspace executables
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
      - name: Smoke test CLI
        run: target/${{ matrix.target }}/release/cyber --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cyber
            target/${{ matrix.target }}/release/cyber-sandbox-exec
          if-no-files-found: error
