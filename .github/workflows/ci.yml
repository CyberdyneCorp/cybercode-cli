name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Commits that only touch root Markdown, docs/ or openspec/ skip the build and test
  # jobs; OpenSpec validation still runs for them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^[^/]+\.md$|^docs/|^openspec/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Line tables keep backtraces useful at a fraction of the size of full debug info;
      # the workspace's test binaries otherwise outgrow the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # Preinstalled SDKs the build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # One retry per failing test; see .config/nextest.toml. Doctests are not run by nextest.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc

  windows-lint:
    name: Windows lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-lint
      - name: Check native Windows lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Every command selects the whole workspace, so dependency features resolve the same
      # way and the test binaries are built once. The tests that run on Windows are the
      # `ci-windows` profile's default-filter in .config/nextest.toml.
      - name: Build workspace and test binaries
        run: cargo test --locked --workspace --no-run
      - name: Smoke test CLI
        run: .\target\debug\cyber.exe --version
      - name: Native Windows tests
        run: cargo nextest run --locked --workspace --profile ci-windows
      - name: Native metadata-only review handles
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --locked --workspace --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-core) & test(import::snapshot::windows::tests)' 2>&1 | Tee-Object -FilePath migration-metadata-handles.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native metadata handle log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-metadata-handles-${{ github.run_id }}
          path: migration-metadata-handles.log
          retention-days: 7
          if-no-files-found: error
      - name: Native migration source snapshots
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --locked --workspace --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-core::import_snapshot)' 2>&1 | Tee-Object -FilePath migration-snapshot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native migration snapshot log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-migration-snapshot-${{ github.run_id }}
          path: migration-snapshot.log
          retention-days: 7
          if-no-files-found: error
      # The only feature-gated tests: their own build of cyber-sandbox.
      - name: Native Windows AppContainer launch and direct-object isolation
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p cyber-sandbox --features windows-test-controls --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-sandbox::windows_container_launch)'

  sdk:
    name: TypeScript SDK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated sources match sdk/openapi.json
        run: python3 ../../scripts/generate_sdk.py --check
      - run: npm ci
      - run: npm run typecheck
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk
      # The end-to-end tests (`test/*.e2e.test.ts`) drive the real binary.
      - name: Build the cyber binary
        working-directory: .
        run: cargo build --locked -p cyber-cli --bin cyber
      - run: npm test
        env:
          CYBER_BIN: ${{ github.workspace }}/target/debug/cyber
      # The plugin kit's end-to-end test runs a plugin host, which is always sandboxed:
      # bubblewrap, and the helper that bridges its network proxy.
      - name: Plugin host sandbox prerequisites
        working-directory: .
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - name: TypeScript plugin kit
        working-directory: sdk/plugin
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
        env:
          CYBER_BIN: ${{ github.workspace }}/target/debug/cyber

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep strict validation identical to the documented local toolchain.
      - run: npm install -g @fission-ai/openspec@1.13.2
      - run: openspec --version
      - run: openspec validate --all --strict
      - run: python3 scripts/spec_lint.py
      - name: Evaluation graders fail the fixtures and pass the reference solutions
        run: python3 scripts/check_eval_graders.py --jobs 4
      - name: Requirement inventory is current
        run: python3 scripts/spec_inventory.py && git diff --exit-code ROADMAP.md

  platforms:
    name: Build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Native C build prerequisites
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y cmake pkg-config musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-musl')
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build workspace executables
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
      - name: Smoke test CLI
        run: target/${{ matrix.target }}/release/cyber --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cyber
            target/${{ matrix.target }}/release/cyber-sandbox-exec
          if-no-files-found: error
