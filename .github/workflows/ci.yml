name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Commits that only touch root Markdown, docs/ or openspec/ skip the build and test
  # jobs; OpenSpec validation still runs for them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^[^/]+\.md$|^docs/|^openspec/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      # Every release target, from .github/build-targets.json. Pull requests skip the
      # `post_merge_only` ones (macOS Intel: its runners queue for hours); pushes to main
      # build them all (`installation-upgrade` → Release targets).
      - id: platforms
        env:
          EVENT: ${{ github.event_name }}
        run: |
          echo "platforms=$(jq -c --arg event "$EVENT" '[.[] | select($event != "pull_request" or (.post_merge_only | not)) | del(.post_merge_only)]' .github/build-targets.json)" >> "$GITHUB_OUTPUT"

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Line tables keep backtraces useful at a fraction of the size of full debug info;
      # the workspace's test binaries otherwise outgrow the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # Preinstalled SDKs the build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      # Every workflow pins Rust 1.99.1. Cargo 1.100 builds test binaries under
      # target/<profile>/build/, where tests no longer find the sandbox helper.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # One retry per failing test; see .config/nextest.toml. Doctests are not run by nextest.
      - run: cargo nextest run --workspace --profile ci
      - run: cargo test --workspace --doc
      # The injection detector's speed target (`untrusted-content`): 5 ms for a 50 KiB
      # page on this runner; the bench fails above twice that.
      - name: Untrusted-content detector benchmark
        if: runner.os == 'Linux'
        run: cargo bench -p cyber-core --bench untrusted_detector

  windows-lint:
    name: Windows lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-lint
      - name: Check native Windows lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  windows:
    name: Windows build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      # Every command selects the whole workspace, so dependency features resolve the same
      # way and the test binaries are built once. The tests that run on Windows are the
      # `ci-windows` profile's default-filter in .config/nextest.toml.
      - name: Build workspace and test binaries
        run: cargo test --locked --workspace --no-run
      - name: Smoke test CLI
        run: .\target\debug\cyber.exe --version
      - name: Native Windows tests
        run: cargo nextest run --locked --workspace --profile ci-windows
      - name: Native metadata-only review handles
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --locked --workspace --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-core) & test(import::snapshot::windows::tests)' 2>&1 | Tee-Object -FilePath migration-metadata-handles.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native metadata handle log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-metadata-handles-${{ github.run_id }}
          path: migration-metadata-handles.log
          retention-days: 7
          if-no-files-found: error
      - name: Native migration source snapshots
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --locked --workspace --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-core::import_snapshot)' 2>&1 | Tee-Object -FilePath migration-snapshot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native migration snapshot log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-migration-snapshot-${{ github.run_id }}
          path: migration-snapshot.log
          retention-days: 7
          if-no-files-found: error
      # The only feature-gated tests: their own build of cyber-sandbox.
      - name: Native Windows AppContainer launch and direct-object isolation
        if: ${{ !cancelled() }}
        run: cargo nextest run --locked -p cyber-sandbox --features windows-test-controls --profile ci-windows --ignore-default-filter -E 'binary_id(cyber-sandbox::windows_container_launch)'

  sdk:
    name: TypeScript SDK
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated sources match sdk/openapi.json
        run: python3 ../../scripts/generate_sdk.py --check
      - run: npm ci
      - run: npm run typecheck
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: sdk
      # The end-to-end tests (`test/*.e2e.test.ts`) drive the real binary.
      - name: Build the cyber binary
        working-directory: .
        run: cargo build --locked -p cyber-cli --bin cyber
      # Integration verification and plugin hosts require the real OS sandbox.
      - name: Sandbox prerequisites
        working-directory: .
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - run: npm test
        env:
          CYBER_BIN: ${{ github.workspace }}/target/debug/cyber
      - name: TypeScript plugin kit
        working-directory: sdk/plugin
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm test
        env:
          CYBER_BIN: ${{ github.workspace }}/target/debug/cyber

  # `editor-integration` → Extension packaging and CI: build, typecheck, lint, unit tests,
  # @vscode/test-electron against the cyber binary built here with a scripted loopback
  # model, and the .vsix as an artifact.
  vscode-extension:
    name: VS Code extension (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: vscode-extension
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the cyber binary
        working-directory: .
        run: cargo build --locked -p cyber-cli --bin cyber && cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Integration tests (xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
        env:
          CYBER_E2E_BINARY: ${{ github.workspace }}/target/debug/cyber
      - name: Integration tests
        if: runner.os == 'macOS'
        run: npm run test:integration
        env:
          CYBER_E2E_BINARY: ${{ github.workspace }}/target/debug/cyber
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: cyber-vscode-extension
          path: clients/vscode/cyber-*.vsix
          if-no-files-found: error
          retention-days: 7

  specs:
    name: OpenSpec
    # Freeze the shell-evaluation toolchain: its mkdir exit status is a lock primitive.
    # Newer runner utility semantics must pass the checker preflight before adoption.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep strict validation identical to the documented local toolchain.
      - run: npm install -g @fission-ai/openspec@1.13.2
      - run: openspec --version
      - run: openspec validate --all --strict
      - run: python3 scripts/spec_lint.py
      - name: Evaluation graders fail the fixtures and pass the reference solutions
        run: python3 scripts/check_eval_graders.py --jobs 4
      - name: Release assets, workflow, Dockerfile and npm launcher
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Install script is POSIX sh
        run: sh -n scripts/install.sh && dash -n scripts/install.sh && shellcheck -s sh scripts/install.sh
      - name: Requirement inventory is current
        run: python3 scripts/spec_inventory.py && git diff --exit-code ROADMAP.md

  platforms:
    name: Build (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.platforms) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Native C build prerequisites
        if: runner.os == 'Linux'
        run: sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y cmake pkg-config musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-musl')
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build workspace executables
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
      - name: Smoke test CLI
        run: target/${{ matrix.target }}/release/cyber${{ matrix.exe }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cyber${{ matrix.exe }}
            target/${{ matrix.target }}/release/cyber-sandbox-exec${{ matrix.exe }}
          if-no-files-found: error

  # `code-intelligence` → Repository map symbol extraction: the bundled grammars may not
  # grow the stripped release binary by more than 12 MiB over the base branch.
  binary-size:
    name: Binary size
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-size
      - name: Compare the stripped release binary with the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          LIMIT_MIB: '12'
        run: |
          set -euo pipefail
          git worktree add ../base "$BASE"
          export CARGO_TARGET_DIR="$PWD/target"
          (cd ../base && cargo build --locked --release -p cyber-cli --bin cyber)
          strip -o base-cyber target/release/cyber
          # Workspace crates are fingerprinted by mtime, not path: make the head's newer.
          find crates -type f -exec touch {} +
          cargo build --locked --release -p cyber-cli --bin cyber
          strip -o head-cyber target/release/cyber
          base=$(stat -c %s base-cyber)
          head=$(stat -c %s head-cyber)
          growth=$((head - base))
          echo "base ${base} bytes, head ${head} bytes, growth ${growth} bytes"
          if [ "$growth" -gt $((LIMIT_MIB * 1024 * 1024)) ]; then
            echo "::error::the stripped release binary grew by more than ${LIMIT_MIB} MiB"
            exit 1
          fi

  dashboard:
    name: Web dashboard
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # pinned commit
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
        working-directory: web
      - run: npm run typecheck && npm run typecheck:e2e && npm run check:build && npm test
        working-directory: web
      - name: Integration sandbox prerequisites
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - run: cargo build -p cyber-cli
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-browser-evidence
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 7
