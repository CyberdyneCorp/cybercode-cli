name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native
      - name: Check workspace and test compilation
        run: cargo check --locked --workspace --all-targets
      - name: Check native Windows lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build workspace executables
        run: cargo build --locked --workspace --bins
      - name: Smoke test CLI
        run: .\target\debug\cyber.exe --version
      - name: Unsupported Unix bridge refuses execution
        run: cargo test --locked -p cyber-sandbox --test bridge
      - name: Native Windows process-tree ownership
        run: cargo test --locked -p cyber-sandbox --test windows_job
      - name: Native parent-owned Windows process trees
        run: cargo test --locked -p cyber-sandbox --test windows_parent_job
      - name: Native tool proxy transport
        run: cargo test --locked -p cyber-tools --lib sandboxing::tests
      - name: Native shell ownership and cancellation
        run: cargo test --locked -p cyber-tools --test windows_shell
      - name: Native PowerShell critical-path analysis
        run: cargo test --locked -p cyber-tools --test inline_removals powershell_native_
      - name: Native PowerShell filesystem facts
        run: cargo test --locked -p cyber-tools --test powershell_analysis native_
      - name: PowerShell source and legacy fallback contracts
        run: cargo test --locked -p cyber-tools --lib tools::powershell::tests
      - name: Native PowerShell tool contracts
        run: cargo test --locked -p cyber-tools --test windows_powershell
      - name: Every registered tool has a golden
        run: cargo test --locked -p cyber-tools --test golden every_registered_tool_has_a_golden
      - name: Native server listener lifecycle
        run: cargo test --locked -p cyber-app --test server
      - name: Native CLI service shutdown
        run: cargo test --locked -p cyber-cli --test cli service_stop_uses_registered_http_shutdown

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated sources match sdk/openapi.json
        run: python3 ../../scripts/generate_sdk.py --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep strict validation identical to the documented local toolchain.
      - run: npm install -g @fission-ai/openspec@1.13.2
      - run: openspec --version
      - run: openspec validate --all --strict
      - run: python3 scripts/spec_lint.py
      - name: Evaluation graders fail the fixtures and pass the reference solutions
        run: python3 scripts/check_eval_graders.py --jobs 4
      - name: Requirement inventory is current
        run: python3 scripts/spec_inventory.py && git diff --exit-code ROADMAP.md

  platforms:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Native C build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-musl')
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build workspace executables
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
      - name: Smoke test CLI
        run: target/${{ matrix.target }}/release/cyber --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cyber
            target/${{ matrix.target }}/release/cyber-sandbox-exec
          if-no-files-found: error
