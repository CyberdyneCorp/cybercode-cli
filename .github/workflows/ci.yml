name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows build
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native
      - name: Check workspace and test compilation
        run: cargo check --locked --workspace --all-targets
      - name: Check native Windows lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build workspace executables
        run: cargo build --locked --workspace --bins
      - name: Smoke test CLI
        run: .\target\debug\cyber.exe --version
      - name: Native worktree startup flags and API admission
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-cli --bin cyber worktree_tests
          cargo test --locked -p cyber-cli --bin cyber listing_renders_status_sessions_and_recovery_diagnostics
          cargo test --locked -p cyber-server --test http worktree_request_validation_precedes_host_dispatch
      - name: Native worktree configuration, repository creation and lock ownership
        run: cargo test --locked -p cyber-core --lib --test worktrees --test worktree_lock --test worktree_repository --test config
      - name: Unsupported Unix bridge refuses execution
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --test bridge
      - name: Native environment credential masking
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --lib env::tests
      - name: Native Windows process-tree ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --test windows_job
      - name: Native parent-owned Windows process trees
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --test windows_parent_job
      - name: Native Windows AppContainer profile and ACL ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --lib windows_container::tests
      - name: Native Windows runtime capability verification
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --lib windows_launch::capabilities::tests
      - name: Native Windows AppContainer launch and direct-object isolation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --features windows-test-controls --test windows_container_launch
      - name: Native Windows AppContainer asynchronous command streams
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --features windows-test-controls --test windows_container_launch piped_ -- --nocapture
      - name: Native Windows foreground AppContainer process adapter
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test windows_container_process -- --nocapture
      - name: Native tool proxy transport
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --lib sandboxing::tests
      - name: Native agent profile resolution
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test agent_profiles
      - name: Native built-in profile tool admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_profiles
      - name: Native client tool profile admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --lib host::tests
      - name: Native durable agent context
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_context
      - name: Native ordered permission rules
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test ordered_permissions --test auto_dispatch -p cyber-server --test auto
      - name: Native agent permission admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_permissions
      - name: Native agent request options
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_requests
      - name: Native agent starting Modes and step limits
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_limits
      - name: Native final no-tools wire choices
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-llm --test adapters runtime_no_tools_choice
      - name: Native structured child results and durable projection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test structured_subagents -p cyber-server --test structured_results
      - name: Native structured result HTTP history
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http typed_child_results_are_available_in_message_history
      - name: Native background subagent ownership and registry recovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test background_subagents -p cyber-server --test jobs
      - name: Native background job API controls
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http background_job_routes_list_scope_and_stop_a_child
      - name: Native background task TUI controls
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tui --lib tasks
      - name: Native exec durable admission and child Job ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --test exec_delegation --test exec_session_usage --bin cyber
      - name: Native Session subtree budgets and config validation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test budgets --test budget_errors -p cyber-core --test config -p cyber-store --test store
      - name: Native Session budget API
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http session_api_persists_budget_and_refuses_invalid_or_reserved_objects
      - name: Native auxiliary web model usage
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test web_skills
      - name: Native repository inspection helper protocol
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-sandbox --test git_inspection
      - name: Native long-root library inspection candidate
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test worktree_repository library_status
      - name: Native Session descendant deletion safety
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test runtime delete_
      - name: Native descendant billing and migration
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test child_usage
      - name: Native descendant billing API
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http session_detail_and_listing_expose_separate_descendant_billing
      - name: Native durable Session usage API
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http session_usage_api
      - name: Native TUI cost snapshots
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tui cost_
      - name: Native explicit user subtasks
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test subtasks --test delegations -p cyber-server --test subtask_cancellation
      - name: Native subtree admission closure
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test subtree_admission --test subtree_stop --test subtree_reopen --test callback_authority --test idle_cancellation --test child_ownership
      - name: Native forked child context and ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test forked_subagents -p cyber-server --test fork_context
      - name: Native child-thread API and TUI browsing
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-server --test http child_thread
          cargo test --locked -p cyber-tui child_thread
      - name: Native subagent resume and attempt replay
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test subagent_resume -p cyber-server --test resume_children --test child_preparation --test admission_authority
      - name: Native automatic structured child handoff
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test isolated_subagents structured_foreground_result_is_collected_before_automatic_queued_attempts -- --exact --nocapture
      - name: Native isolated child checkout execution
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-tools --test isolated_subagents interrupt_cancels_public_child_preparation_before_late_setup_or_input -- --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --test isolated_subagents -- --test-threads=1
      - name: Native durable subagent names
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test subagent_names -p cyber-tools --test subagent_names
      - name: Native foreground subagent ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test subagents
      - name: Native agent model selection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_models
      - name: Native app-host inference delegation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --lib app_host_delegates_validated_agent_request_options
      - name: Native model selection API
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http model
      - name: Native request option layering
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-llm --test catalog
      - name: Native parent deny inheritance
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test parent_permissions
      - name: Native Turn identity pinning
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test modes
      - name: Native parent Mode ceilings
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test parent_modes
      - name: Native ancestor request visibility and scoped replies
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test requests
      - name: Native ancestor request reply endpoints
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http parent_endpoint_replies_to_child_requests_and_refuses_unrelated_sessions
      - name: Native routed child request streams
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http child_requests_reach_parent_location_and_session_streams_without_changing_replay_cursor
      - name: Native TUI child approvals and durable admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tui --lib
      - name: Native historical context compatibility
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test context_compaction historical_epoch_without_a_system_prefix_keeps_legacy_request_bytes
      - name: Native worktree setup admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test worktree_setup
      - name: Native durable worktree setup recovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test worktree_setup_journal --test worktree_setup_output --test location_activity
      - name: Native shell ownership and cancellation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test windows_shell
      - name: Native PowerShell critical-path analysis
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test inline_removals powershell_native_
      - name: Native PowerShell filesystem facts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test powershell_analysis native_
      - name: PowerShell source and legacy fallback contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --lib tools::powershell::tests
      - name: Native PowerShell tool contracts
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test windows_powershell
      - name: Every registered tool has a golden
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test golden every_registered_tool_has_a_golden
      - name: Native runtime shutdown
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test runtime shutdown_
      - name: Native server listener lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test server
      - name: Native pending HTTP2 request cleanup
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test transport
      - name: Native active-tool service shutdown
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test windows_service
      - name: Native CLI service shutdown
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --test cli service_stop_uses_registered_http_shutdown

  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generated sources match sdk/openapi.json
        run: python3 ../../scripts/generate_sdk.py --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  specs:
    name: OpenSpec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep strict validation identical to the documented local toolchain.
      - run: npm install -g @fission-ai/openspec@1.13.2
      - run: openspec --version
      - run: openspec validate --all --strict
      - run: python3 scripts/spec_lint.py
      - name: Evaluation graders fail the fixtures and pass the reference solutions
        run: python3 scripts/check_eval_graders.py --jobs 4
      - name: Requirement inventory is current
        run: python3 scripts/spec_inventory.py && git diff --exit-code ROADMAP.md

  platforms:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: platform-${{ matrix.target }}
      - name: Native C build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake pkg-config musl-tools
      - name: Configure musl linker
        if: endsWith(matrix.target, '-musl')
        run: |
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc' >> "$GITHUB_ENV"
          echo 'CC=musl-gcc' >> "$GITHUB_ENV"
      - name: Build workspace executables
        run: cargo build --locked --release --workspace --bins --target ${{ matrix.target }}
      - name: Smoke test CLI
        run: target/${{ matrix.target }}/release/cyber --version
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cyber
            target/${{ matrix.target }}/release/cyber-sandbox-exec
          if-no-files-found: error
