name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Commits that only touch root Markdown, docs/ or openspec/ skip the build and test
  # jobs; OpenSpec validation still runs for them.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qvE '^[^/]+\.md$|^docs/|^openspec/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  rust:
    name: Rust (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # The workspace's test binaries outgrow the runner's free space; drop preinstalled
        # SDKs the build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast

  windows-lint:
    name: Windows lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-lint
      - name: Check native Windows lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build Windows process ownership helper
        if: ${{ !cancelled() }}
        run: cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - name: Native Bash shell selection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --lib tools::bash::shell_tests
      - name: Native code intelligence configuration and discovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test config --test intelligence_config --test intelligence_discovery --test formatter_discovery
      - name: Native migration approval and sandbox conversion
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_policy
      - name: Native migration permission conversion
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_permissions
      - name: Native migration source inventory
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_discovery
      - name: Native metadata-only review handles
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --lib import::snapshot::windows::tests 2>&1 | Tee-Object -FilePath migration-metadata-handles.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native metadata handle log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-metadata-handles-${{ github.run_id }}
          path: migration-metadata-handles.log
          retention-days: 7
          if-no-files-found: error
      - name: Native migration source snapshots
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --test import_snapshot 2>&1 | Tee-Object -FilePath migration-snapshot.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native migration snapshot log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-migration-snapshot-${{ github.run_id }}
          path: migration-snapshot.log
          retention-days: 7
          if-no-files-found: error
      - name: Native migration detection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_detection
      - name: Native read-only migration previews
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_preview
      - name: Native read-time skill compatibility
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --test skills_compat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test server skill_compat_precedence_and_switches_apply_over_http
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native plugin resolution
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --test plugins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-core --lib plugins::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib plugin_host::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native browser verification
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --lib browser::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib browser_evidence::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib -- browser:: dev_server::
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test browser_cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native MCP migration and disabled configuration
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test import_mcp --test mcp_config
      - name: Native migration provider conversion
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test commands --test import_providers --test import_opencode_providers --test import_opencode_settings
      - name: Native path-triggered skill reminders
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test path_skills
      - name: Native skill-scoped permissions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test skill_scopes
      - name: Native ordinary permission regression
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test agent_permissions
      - name: Native admission reconciliation controls
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tui --lib reconciliation
      - name: Native CLI admission reconciliation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --test cli api_reconciliation
      - name: Native authenticated delegation reconciliation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test http delegation_reconciliation_api
      - name: Native delegation receipt reconciliation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test delegation_recovery
      - name: Native cross-session message records, addressing, listing, sends, model tools, inbound controls, limits, MCP depth, idle notifications, usage attribution, history, CLI, TUI and MCP serve tools
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --lib config::messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-core --test config managed_policy_disables_messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib permissions::engine::tests::message_send
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --test messaging_tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-store --lib migrate::tests::messaging_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-store --lib migrate::tests::usage_origin_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib runtime::usage_origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test usage_ledger ledger_rows_carry_their_origin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-store --test store reproject_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-store --test store an_append_fault_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib runtime::messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test mcp_serve a_send_message_leg_carries_the_depth
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib http::mcp_serve::messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test mcp_serve messaging_tools_map_onto_the_messaging_api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test mcp_serve_cli the_bridge_sends_and_reads_messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test mcp usage_in_a_turn_woken_through_mcp_serve_is_attributed_to_mcp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --bin cyber commands::messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --bin cyber tree::tests::peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test messages_cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib taking_back_skips_received_messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib screens_messages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native direct peers config, error tags, token redaction, TLS identity, peer listener, grants, peer client, cyber peers, peer sends, listings, watches, discovery, attach and surfaces
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-core --lib config::peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-core --lib memory::secrets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-core --test config peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib peer_error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib http::error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib http::peer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib runtime::peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib runtime::messaging
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib permissions::engine::tests::remote_attach
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --test peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --lib peer_tokens
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-app --lib peer_discovery
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --bin cyber peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test peers_cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --bin cyber commands::attach
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-client --lib peer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib the_tui_opens_a_peer_session_through_an_attach
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib screens_peers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tui --lib messaging::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native bundled skill discovery and agent profiles
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --lib --test agent_profiles
      - name: Native bundled skill execution and worktrees
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test bundled_skills
      - name: Native bundled command catalogue
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test server bundled_skill_catalogue
      - name: Native reviewer skill selection and ceilings
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test reviewer_skills
      - name: Native forked skill execution
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test forked_skills
      - name: Native user skill command admission
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test skill_commands
      - name: Native authenticated user skill commands
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test server authenticated_skill_commands
      - name: Native read-time command discovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test command_discovery
      - name: Native host command scope controls
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test command_discovery
      - name: Native imported static command consumption
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test server command
      - name: Native command template shell injection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test template_injection
      # Production path: `cyber exec --command` template injection fails closed without
      # a Windows sandbox and runs only under explicit full access. The run snapshots a
      # git repository, so the shadow repository's plain-path units run first.
      - name: Native command template injection through exec
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-snapshot --lib
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test exec_template_expansion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Remote skill sources: cache paths, staging swap and trust through the app host
      # with an in-process fetcher; the index path validation runs in the library units.
      - name: Native remote skill sources
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked -p cyber-app --test server remote_skill
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib remote_skills
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native imported provider configuration and catalog
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-llm --test import_providers
      - name: Native imported compaction configuration
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --test import_compaction
      - name: Native imported permission engine decisions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test import_permissions
      - name: Native CLI commands and intelligence status
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --test cli
      - name: Native authenticated code intelligence status
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test intelligence --test registered_status
      - name: Native LSP transport framing
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test lsp_transport --test lsp_client --test lsp_pool --test lsp_idle --test lsp_launch
      - name: Native LSP resource and Location ownership
        if: ${{ !cancelled() }}
        run: 'cargo test --locked -p cyber-tools --lib lsp::'
      - name: Native language-server checkout ownership
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test worktree_repository lsp_
      - name: Native managed language-server launch and settlement
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test worktree_setup lsp_
      - name: Native read background warming
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test tools successful_read_warms_in_background_without_waiting_for_discovery
      - name: Native notebook cell editing and output contract
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test notebook --test golden
      - name: Native memory handle privacy and namespace operations
        if: ${{ !cancelled() }}
        run: 'cargo test --locked -p cyber-core --lib memory::'
      - name: Native test failure propagation regression
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test ci_contracts
      - name: Native private memory storage
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test memory_storage
      - name: Native public memory core mutation and recovery
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test memory_mutation_windows
      - name: Native memory database reconciliation
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-server --lib runtime::memory
      - name: Native model memory tool and runtime context lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tools --test memory --test memory_context
      - name: Native authenticated application memory lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-app --test memory
      - name: Native CLI memory database identity inspection
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --bin cyber commands::memory::recovery::native
      - name: Native CLI memory editor and recovery lifecycle
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-cli --test memory
      - name: Native public client checkpoint storage
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test memory_client_state
      - name: Native TUI memory retention
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-tui --lib memory
      - name: Native private memory startup
        if: ${{ !cancelled() }}
        run: cargo test --locked -p cyber-core --test paths ensure_

  windows:
    name: Windows build
    needs: [changes, windows-lint]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-native
      - name: Check workspace and test compilation
        run: cargo check --locked --workspace --all-targets
      - name: Build workspace executables
        run: cargo build --locked --workspace --bins
      - name: Smoke test CLI
        run: .\target\debug\cyber.exe --version
      - name: Native worktree startup flags and API admission
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          cargo test --locked -p cyber-cli --bin cyber worktree_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --bin cyber listing_renders_status_sessions_and_recovery_diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test http worktree_request_validation_precedes_host_dispatch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native worktree configuration, repository creation and lock ownership
        run: cargo test --locked -p cyber-core --lib --test worktrees --test worktree_lock --test worktree_repository --test config
      - name: Native MCP configuration, framed protocol and startup wait
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-core --test mcp_config --test mcp_trust -p cyber-tools --test mcp_protocol --test mcp_authority --test mcp_discovery --test mcp_wait
      - name: Native MCP passive transport and leader-exit observation
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          cargo test --locked -p cyber-tools --lib mcp::stdio::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib mcp::roots::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib mcp::elicitation::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib mcp::sampling::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib tools::process::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native scope-aware deferred tool materialization
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          cargo test --locked -p cyber-core --lib config::deferred_tools::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib runtime::deferred_tools::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test runtime loaded_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test context_compaction loaded_schemas
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --lib tools::tool_search::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-tools --test golden tool_search_golden
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native MCP retained startup joins and bounded reconnect
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-tools --lib mcp::pool::tests
      - name: Native MCP retained proxy settlement
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-tools --lib mcp::launch::tests
      - name: Native independent MCP ownership and restart fencing
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-server --test mcp_ownership
      - name: Native tool registration identity through dispatch
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          cargo test --locked -p cyber-server --test runtime registration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --lib http::remote_tools::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native application client-tool schema and permission boundaries
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-app --lib host::tests
      - name: Native authenticated MCP Location-close API
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: cargo test --locked -p cyber-app --test mcp
      - name: Native M1.3 increment 4 acceptance (forked injection, client hooks, eager calls, git text)
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          cargo test --locked -p cyber-app --test server -- forked_skill_shell_injection_expands_once_before_the_child client_pre_tool_use_handler_approves_docs_edits_through_the_app client_hook_handlers_do_not_reach_other_clients_sessions openai_compatible_call_is_durable_while_its_stream_is_still_open
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test runtime complete_tool_call_is_durable_before_the_stream_finishes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-server --test http client_hook_registration_drops_on_disconnect
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p cyber-cli --test git_commit_msg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native MCP definition review and trust CLI
        if: ${{ !cancelled() }}
