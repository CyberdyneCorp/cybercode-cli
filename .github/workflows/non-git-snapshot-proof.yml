name: Snapshot native proof
on:
  pull_request:
    paths:
      - crates/cyber-snapshot/**
      - crates/cyber-app/Cargo.toml
      - crates/cyber-app/src/**
      - crates/cyber-app/tests/support/scripted_model.rs
      - crates/cyber-server/src/runtime/snapshot*.rs
      - crates/cyber-server/src/runtime/rewind*.rs
      - crates/cyber-server/src/http/sessions.rs
      - crates/cyber-app/tests/snapshot_git_runtime.rs
      - crates/cyber-cli/Cargo.toml
      - crates/cyber-cli/src/**
      - crates/cyber-cli/tests/branches_cli.rs
      - crates/cyber-cli/tests/exec_stream_input.rs
      - crates/cyber-cli/tests/support/**
      - crates/cyber-server/src/workspace.rs
      - crates/cyber-core/src/binary/native/**
      - crates/cyber-core/src/binary/native.rs
      - crates/cyber-core/src/worktrees/**
      - Cargo.lock
      - .github/workflows/non-git-snapshot-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: non-git-snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Snapshot native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: non-git-snapshot-proof
      - name: Sandbox prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.* && sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts the user namespaces required by bubblewrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          cargo build --locked -p cyber-sandbox --bin cyber-sandbox-exec
      - name: Native storage, conflict and process-kill proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-snapshot -- --nocapture 2>&1 | tee non-git-snapshot-proof.log
      - name: Read-only checkout acknowledgement requirement
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-core --lib worktrees::activity::snapshot::acknowledgement::tests::maintenance_requires_an_existing_acknowledgement_without_publishing_one -- --exact --nocapture 2>&1 | tee managed-checkout-ack-proof.log
      - name: Owned Git runtime acceptance candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-snapshot --features native-git-acceptance -- --nocapture 2>&1 | tee git-adapter-proof.log
          cargo test --locked -p cyber-app --features native-git-acceptance --test snapshot_git_runtime -- --nocapture 2>&1 | tee git-runtime-proof.log
      - name: Managed Git CLI process-death recovery candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-cli --features native-git-acceptance --test branches_cli managed_git_keep_and_rollback_after_real_partial_restore_kill -- --nocapture 2>&1 | tee git-cli-recovery-proof.log
      - name: JSONL driver and atomic last-message regressions
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-cli --features native-git-acceptance --bin cyber commands::exec::last_message::tests -- --nocapture 2>&1 | tee jsonl-driver-proof.log
          cargo test --locked -p cyber-cli --features native-git-acceptance --test exec_stream_input -- --nocapture 2>&1 | tee -a jsonl-driver-proof.log
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-git-snapshot-proof-${{ matrix.os }}
          path: |
            non-git-snapshot-proof.log
            managed-checkout-ack-proof.log
            git-adapter-proof.log
            git-runtime-proof.log
            git-cli-recovery-proof.log
            jsonl-driver-proof.log
          if-no-files-found: warn
