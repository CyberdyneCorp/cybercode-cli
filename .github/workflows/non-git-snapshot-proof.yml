name: Non-Git snapshot native proof
on:
  pull_request:
    paths:
      - crates/cyber-snapshot/**
      - crates/cyber-core/src/binary/native/**
      - crates/cyber-core/src/binary/native.rs
      - Cargo.lock
      - .github/workflows/non-git-snapshot-proof.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: non-git-snapshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: File-copy snapshots (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: non-git-snapshot-proof
      - name: Native storage, conflict and process-kill proof
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-snapshot -- --nocapture 2>&1 | tee non-git-snapshot-proof.log
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: non-git-snapshot-proof-${{ matrix.os }}
          path: non-git-snapshot-proof.log
          if-no-files-found: warn
