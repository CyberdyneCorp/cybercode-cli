name: Linux plugin mount composition
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probes/plugin-native-entry/linux_mounts.mts
      - .github/workflows/plugin-linux-mounts.yml
  push:
    branches: [main]
    paths:
      - scripts/probes/plugin-native-entry/linux_mounts.mts
      - .github/workflows/plugin-linux-mounts.yml
permissions:
  contents: read
concurrency:
  group: plugin-linux-mounts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  mounts:
    name: Mount composition (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare namespace prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Verify native controls and ancestor anchors
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/probes/plugin-native-entry/linux_mounts.mts --report "$RUNNER_TEMP/linux-mounts.json"
      - name: Retain native mount receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-mounts-${{ matrix.os }}
          path: ${{ runner.temp }}/linux-mounts.json
          if-no-files-found: warn
          retention-days: 14
