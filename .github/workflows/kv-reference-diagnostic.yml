name: KV reference diagnostic

on:
  push:
    branches: [diagnostics/kv-reference-ci]

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Ensure syscall tracing is available
        run: command -v strace || (sudo apt-get update -qq && sudo apt-get install -y strace)
      - name: Exercise unchanged Linux reference controls
        env:
          TMPDIR: ${{ runner.temp }}/kv-reference-control-tmp
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 scripts/diagnose_kv_reference.py
          --output "${{ runner.temp }}/kv-reference-diagnostic"
          --attempts 30
          --trace
      - name: Retain bounded diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kv-reference-diagnostic-${{ matrix.os }}
          path: ${{ runner.temp }}/kv-reference-diagnostic
          if-no-files-found: warn
          retention-days: 7

