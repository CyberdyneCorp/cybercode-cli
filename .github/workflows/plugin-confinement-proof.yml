name: Plugin confinement proof

on:
  workflow_dispatch:
    inputs:
      staged_system_diagnostic:
        description: Run the historical re-signed system-image experiment (known arm64 startup failure)
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/probes/plugin-confinement/**
      - .github/workflows/plugin-confinement-proof.yml
  push:
    branches: [main]
    paths:
      - scripts/probes/plugin-confinement/**
      - .github/workflows/plugin-confinement-proof.yml

permissions:
  contents: read

concurrency:
  group: plugin-confinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native proof (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
        runtime: [node, python, bun, deno, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: 'v2.9.8'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y bubblewrap linux-libc-dev strace
          # Match the project's native sandbox test setup; failed namespace
          # admission remains a test failure, never an unconfined fallback.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run native capability matrix
        env:
          PROOF_RUNTIME: ${{ matrix.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--runtime "$PROOF_RUNTIME" --report "$RUNNER_TEMP/proof.json")
          if [[ "$PROOF_RUNTIME" == python ]]; then
            args+=(--python "$(command -v python3)")
          fi
          if [[ "$PROOF_RUNTIME" == bun || "$PROOF_RUNTIME" == deno ]]; then
            args+=(--executable "$(command -v "$PROOF_RUNTIME")")
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            # All five runtimes now require the same pre-target-instruction
            # exec boundary. A diagnostic/traced retry cannot turn failure green.
            args+=(--initial-exec --trace "$RUNNER_TEMP/proof-trace")
          elif [[ "$PROOF_RUNTIME" == native ]]; then
            # Preserve the target signature; the same pre-runtime boundary
            # must cover shell=false before the native constructor runs.
            args+=(--macos-signing-native)
          fi
          node --experimental-strip-types scripts/probes/plugin-confinement/run.mts "${args[@]}" > "$RUNNER_TEMP/proof.log" 2>&1
      - name: Retain exact-source native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-proof-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/proof.json
            ${{ runner.temp }}/proof.log
            ${{ runner.temp }}/proof-trace/
          if-no-files-found: error
          retention-days: 14

  macos-native-gap:
    if: github.event_name == 'workflow_dispatch' && inputs.staged_system_diagnostic
    name: Historical staged-system diagnostic (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify exec counterexamples, staged candidate and inherited descriptors
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/probes/plugin-confinement/macos_native_exec.mts --report "$RUNNER_TEMP/proof.json" > "$RUNNER_TEMP/proof.log" 2>&1
      - name: Retain native exec gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-exec-gap-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/proof.json
            ${{ runner.temp }}/proof.log
          if-no-files-found: error
          retention-days: 14

  macos-signing-candidate:
    name: Native signing-identity candidate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify capability matrix and original-signature exec controls
        shell: bash
        run: |
          set -euo pipefail
          # Acceptance requires original-image positive startup, denied self-exec,
          # matching-identity counterexamples and descriptor isolation.
          # The historical re-signing experiment remains an opt-in diagnostic;
          # its failed startup control is never counted as confinement.
          node --experimental-strip-types scripts/probes/plugin-confinement/run.mts --runtime native --macos-signing-native --macos-private-unix --report "$RUNNER_TEMP/matrix.json" > "$RUNNER_TEMP/matrix.log" 2>&1
          node --experimental-strip-types scripts/probes/plugin-confinement/macos_signing_exec.mts --report "$RUNNER_TEMP/exec.json" > "$RUNNER_TEMP/exec.log" 2>&1
      - name: Reject missing scratch UNIX policy
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/macos-private-unix-missing-grant"
          python3 - "$control" <<'PYCONTROL'
          from pathlib import Path
          import shutil, sys
          target = Path(sys.argv[1])
          shutil.copytree('scripts/probes/plugin-confinement', target, ignore=shutil.ignore_patterns('evidence', '__pycache__'))
          driver = target / 'macos_policy.mts'
          text = driver.read_text()
          before = '  if (privateUnix) {'
          assert text.count(before) == 1
          driver.write_text(text.replace(before, '  if (false) { // Missing scratch UNIX grant control.'))
          PYCONTROL
          log="$RUNNER_TEMP/private-unix-missing-grant.log"
          if node --experimental-strip-types "$control/run.mts" --runtime native --macos-signing-native --macos-private-unix --report "$control/result.json" > "$log" 2>&1; then
            echo 'Missing private UNIX policy unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$log" <<'PYCONTROL'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'no-capabilities: private UNIX runtime exchange failed: [false,false]' in text, text
          PYCONTROL
      - name: Verify owned UNIX endpoints and native peer identity
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/probes/plugin-confinement/macos_private_ipc.mts --report "$RUNNER_TEMP/unix-boundary.json" > "$RUNNER_TEMP/unix-boundary.log" 2>&1
          log="$RUNNER_TEMP/unix-missing-scope.log"
          if node --experimental-strip-types scripts/probes/plugin-confinement/macos_private_ipc.mts --missing-scope > "$log" 2>&1; then
            echo 'Missing UNIX outbound scope unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$log" <<'PYCONTROL'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'macOS datagram endpoint escaped scratch:' in text, text
          for token in ['"owner_received_fixture":true', '"acknowledged":true',
                        '"owner_datagram_received_fixture":true', '"datagram_receipts":6',
                        '"private_aliases":[true,true]', '"private_peer_matches":true']:
              assert token in text, text
          PYCONTROL
      - name: Reject missing private descriptor reception
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/unix-dropped-rights.log"
          if node --experimental-strip-types scripts/probes/plugin-confinement/macos_private_ipc.mts --drop-rights > "$log" 2>&1; then
            echo 'Missing SCM_RIGHTS reception unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$log" <<'PYCONTROL'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'private SCM_RIGHTS exchange failed:' in text, text
          for token in ['"original_closed":true', '"sent":true', '"token":true',
                        '"received":false', '"rights_payload":"A"', '"private_aliases":[true,true]']:
              assert token in text, text
          PYCONTROL
      - name: Reject owner payload path re-resolution
        shell: bash
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/macos-rights-path-reader"
          python3 - "$control" <<'PYCONTROL'
          from pathlib import Path
          import shutil, sys
          target = Path(sys.argv[1])
          shutil.copytree('scripts/probes/plugin-confinement', target, ignore=shutil.ignore_patterns('evidence', '__pycache__'))
          driver = target / 'macos_private_ipc.mts'
          text = driver.read_text()
          before = '    const rights_payload = contents.subarray(0, count).toString();'
          assert text.count(before) == 1
          driver.write_text(text.replace(before, '    const rights_payload = readFileSync(join(paths.scratch, "rights.bin"), "utf8");'))
          PYCONTROL
          log="$RUNNER_TEMP/unix-rights-path-reader.log"
          if node --experimental-strip-types "$control/macos_private_ipc.mts" > "$log" 2>&1; then
            echo 'Owner path re-resolution unexpectedly passed' >&2
            exit 1
          fi
          python3 - "$log" <<'PYCONTROL'
          from pathlib import Path
          import sys
          text = Path(sys.argv[1]).read_text()
          assert 'received descriptor file effect:' in text, text
          for token in ['"rights_path_replaced":true', '"rights_link_count":0',
                        '"rights_payload":"XX"', '"written":true', '"original_closed":true']:
              assert token in text, text
          PYCONTROL
      - name: Retain signing-identity candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-signing-candidate-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/matrix.json
            ${{ runner.temp }}/matrix.log
            ${{ runner.temp }}/private-unix-missing-grant.log
            ${{ runner.temp }}/unix-boundary.json
            ${{ runner.temp }}/unix-boundary.log
            ${{ runner.temp }}/unix-missing-scope.log
            ${{ runner.temp }}/unix-dropped-rights.log
            ${{ runner.temp }}/unix-rights-path-reader.log
            ${{ runner.temp }}/exec.json
            ${{ runner.temp }}/exec.log
          if-no-files-found: error
          retention-days: 14

  macos-signing-runtime:
    name: Runtime signing-identity candidate (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
        runtime: [node, python, python-system, bun, deno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: 'v2.9.8'
      - name: Verify policy precedes runtime startup
        env:
          PROOF_RUNTIME: ${{ matrix.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          runtime="$PROOF_RUNTIME"
          if [[ "$runtime" == python-system ]]; then
            runtime=python
          fi
          args=(--runtime "$runtime" --macos-signing-runtime --macos-private-unix --report "$RUNNER_TEMP/proof.json")
          if [[ "$PROOF_RUNTIME" == python ]]; then
            args+=(--python "$(command -v python3)")
          elif [[ "$PROOF_RUNTIME" == python-system ]]; then
            # Exercise framework-image discovery without an embedding library.
            args+=(--python /usr/bin/python3)
          fi
          if [[ "$PROOF_RUNTIME" == bun || "$PROOF_RUNTIME" == deno ]]; then
            args+=(--executable "$(command -v "$PROOF_RUNTIME")")
          fi
          node --experimental-strip-types scripts/probes/plugin-confinement/run.mts "${args[@]}" > "$RUNNER_TEMP/proof.log" 2>&1
      - name: Retain pre-runtime policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-signing-candidate-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/proof.json
            ${{ runner.temp }}/proof.log
          if-no-files-found: error
          retention-days: 14
