name: Plugin confinement proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/probes/plugin-confinement/**
      - .github/workflows/plugin-confinement-proof.yml
  push:
    branches: [main]
    paths:
      - scripts/probes/plugin-confinement/**
      - .github/workflows/plugin-confinement-proof.yml

permissions:
  contents: read

concurrency:
  group: plugin-confinement-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native proof (${{ matrix.os }}, ${{ matrix.runtime }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
        runtime: [node, python, bun, deno, native]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: matrix.runtime == 'python'
        with:
          python-version: '3.13'
      - uses: oven-sh/setup-bun@v2
        if: matrix.runtime == 'bun'
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        if: matrix.runtime == 'deno'
        with:
          deno-version: 'v2.9.8'
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update
          sudo apt-get install -y bubblewrap linux-libc-dev strace
          # Match the project's native sandbox test setup; failed namespace
          # admission remains a test failure, never an unconfined fallback.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Run native capability matrix
        env:
          PROOF_RUNTIME: ${{ matrix.runtime }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--runtime "$PROOF_RUNTIME" --report "$RUNNER_TEMP/proof.json")
          if [[ "$PROOF_RUNTIME" == python ]]; then
            args+=(--python "$(command -v python3)")
          fi
          if [[ "$PROOF_RUNTIME" == bun || "$PROOF_RUNTIME" == deno ]]; then
            args+=(--executable "$(command -v "$PROOF_RUNTIME")")
          fi
          if [[ "$RUNNER_OS" == Linux ]]; then
            # All five runtimes now require the same pre-target-instruction
            # exec boundary. A diagnostic/traced retry cannot turn failure green.
            args+=(--initial-exec --trace "$RUNNER_TEMP/proof-trace")
          fi
          node --experimental-strip-types scripts/probes/plugin-confinement/run.mts "${args[@]}" > "$RUNNER_TEMP/proof.log" 2>&1
      - name: Retain exact-source native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-proof-${{ matrix.os }}-${{ matrix.runtime }}
          path: |
            ${{ runner.temp }}/proof.json
            ${{ runner.temp }}/proof.log
            ${{ runner.temp }}/proof-trace/
          if-no-files-found: error
          retention-days: 14

  macos-native-gap:
    name: Native initial-exec gap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify initial exec, literal-rule and platform-subject gaps
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/probes/plugin-confinement/macos_native_exec.mts --report "$RUNNER_TEMP/proof.json" > "$RUNNER_TEMP/proof.log" 2>&1
      - name: Retain native exec gap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-exec-gap-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/proof.json
            ${{ runner.temp }}/proof.log
          if-no-files-found: error
          retention-days: 14
