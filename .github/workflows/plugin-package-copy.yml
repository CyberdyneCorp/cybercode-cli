name: Plugin package copy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/cyber-core/src/plugins/**
      - crates/cyber-core/src/plugins.rs
      - crates/cyber-sandbox/**
      - Cargo.lock
      - .github/workflows/plugin-package-copy.yml
  push:
    branches: [main]
    paths:
      - crates/cyber-core/src/plugins/**
      - crates/cyber-core/src/plugins.rs
      - crates/cyber-sandbox/**
      - Cargo.lock
      - .github/workflows/plugin-package-copy.yml

permissions:
  contents: read

concurrency:
  group: plugin-package-copy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  copy:
    name: Package copy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-latest]
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify package capture and actual helper protocol
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p cyber-core --lib plugins::image
          cargo test --locked -p cyber-sandbox --lib plugin_image
          cargo test --locked -p cyber-sandbox --test plugin_copy
          cargo test --locked -p cyber-sandbox --doc
      - name: Verify generation commit controls
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source=crates/cyber-sandbox/src/plugin_image/authority.rs
          cp "$source" "$RUNNER_TEMP/authority-positive.rs"
          trap 'cp "$RUNNER_TEMP/authority-positive.rs" "$source"' EXIT
          for control in gate check; do
            cp "$RUNNER_TEMP/authority-positive.rs" "$source"
            python3 - "$source" "$control" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          if sys.argv[2] == 'gate':
              start = text.index('        let _guard = match self.authority.gate.lock() {')
              end = text.index('        lease.check()?;', start)
              text = text[:start] + text[end:]
          else:
              assert text.count('        lease.check()?;') == 1
              text = text.replace('        lease.check()?;', '')
          path.write_text(text)
          PY
            if [[ "$control" == gate ]]; then
              name=revocation_serializes_with_an_already_committed_start
            else
              name=revoked_and_dropped_authorities_never_enter_a_commit
            fi
            if cargo test --locked -p cyber-sandbox --lib "plugin_image::authority::tests::$name" -- --exact > "$RUNNER_TEMP/authority-$control-control.log" 2>&1; then
              cat "$RUNNER_TEMP/authority-$control-control.log"
              echo "Missing-$control control unexpectedly passed" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/authority-$control-control.log"
            python3 - "$RUNNER_TEMP/authority-$control-control.log" "$control" "$name" <<'PY'
          from pathlib import Path
          import re, sys
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', Path(sys.argv[1]).read_text())
          assert f'{sys.argv[3]} ... FAILED' in text
          if sys.argv[2] == 'gate':
              assert 'revocation returned while start was still active' in text or 'committed start lost its generation gate' in text
          else:
              assert 'revoked start executed' in text
          PY
          done
          cp "$RUNNER_TEMP/authority-positive.rs" "$source"
          cargo test --locked -p cyber-sandbox --lib plugin_image
      - name: Verify owner-process source IO breaks the SQLite lock regression
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if CYBER_PLUGIN_COPY_IN_OWNER_CONTROL=1 cargo test --locked -p cyber-sandbox --test plugin_copy worker_source_io_preserves_owner_sqlite_locks -- --exact > "$RUNNER_TEMP/owner-control.log" 2>&1; then
            cat "$RUNNER_TEMP/owner-control.log"
            echo 'Owner-process IO negative control unexpectedly passed'
            exit 1
          fi
          grep -F 'owner lock was released' "$RUNNER_TEMP/owner-control.log"
          # Restore the positive check after the intentional failing control.
          cargo test --locked -p cyber-sandbox --test plugin_copy worker_source_io_preserves_owner_sqlite_locks -- --exact
      - name: Verify private inventory failure controls
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          source=crates/cyber-sandbox/src/plugin_image/private_roots.rs
          cp "$source" "$RUNNER_TEMP/private-inventory-positive.rs"
          trap 'cp "$RUNNER_TEMP/private-inventory-positive.rs" "$source"' EXIT
          for control in alias recheck io; do
            cp "$RUNNER_TEMP/private-inventory-positive.rs" "$source"
            python3 - "$source" "$control" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          control = sys.argv[2]
          if control == 'alias':
              before, after = '|| (metadata.is_file() && metadata.nlink() != 1)', ''
          elif control == 'recheck':
              before, after = 'if current.records != self.records {', 'if false {'
          else:
              before = '            let is_directory = state.directory;'
              after = '            if !state.directory { drop(parent.open(name).map_err(|_| Error::Io)?); }\n' + before
          assert text.count(before) == 1
          path.write_text(text.replace(before, after))
          PY
            if [[ "$control" == alias ]]; then
              name=private_inventory_refuses_external_and_internal_hard_links_before_and_after_capture
              args=(--lib "plugin_image::private_roots::tests::$name")
            elif [[ "$control" == recheck ]]; then
              name=private_inventory_accepts_nested_roots_and_detects_changed_bytes_names_and_modes
              args=(--lib "plugin_image::private_roots::tests::$name")
            else
              name=worker_source_io_preserves_owner_sqlite_locks
              args=(--test plugin_copy "$name")
            fi
            if cargo test --locked -p cyber-sandbox "${args[@]}" -- --exact > "$RUNNER_TEMP/private-$control-control.log" 2>&1; then
              cat "$RUNNER_TEMP/private-$control-control.log"
              echo "Private $control control unexpectedly passed" >&2
              exit 1
            fi
            cat "$RUNNER_TEMP/private-$control-control.log"
            python3 - "$RUNNER_TEMP/private-$control-control.log" "$name" "$control" <<'PY'
          from pathlib import Path
          import re, sys
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', Path(sys.argv[1]).read_text())
          assert f'{sys.argv[2]} ... FAILED' in text
          expected = {'alias': 'unwrap_err()', 'recheck': 'assertion failed: inventory.recheck().is_err()', 'io': 'owner lock was released'}
          assert expected[sys.argv[3]] in text
          PY
          done
          cp "$RUNNER_TEMP/private-inventory-positive.rs" "$source"
          cargo test --locked -p cyber-sandbox --lib plugin_image
          cargo test --locked -p cyber-sandbox --test plugin_copy
      - name: Retain owner IO counterexample
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: package-copy-owner-control-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/owner-control.log
            ${{ runner.temp }}/private-alias-control.log
            ${{ runner.temp }}/private-recheck-control.log
            ${{ runner.temp }}/private-io-control.log
            ${{ runner.temp }}/authority-gate-control.log
            ${{ runner.temp }}/authority-check-control.log
          if-no-files-found: warn
          retention-days: 14
