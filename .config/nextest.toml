# cargo-nextest settings (https://nexte.st). CI runs `cargo nextest run --profile ci`.

[profile.ci]
# A test that fails and then passes on its retry is reported FLAKY instead of failing the
# run; one that fails both times still fails it. Timing-sensitive tests are tracked in
# issue #8 rather than hidden.
retries = 1
fail-fast = false
failure-output = "immediate-final"

# Windows runs one curated subset of the suite instead of the whole workspace: tests
# that are not yet ported (Unix-only tools, transports and sandboxing) are left out. One
# `cargo nextest run --workspace` builds every test binary once; a separate `cargo test
# -p …` per subset resolved dependency features differently and rebuilt the crate stack
# each time, which pushed the Windows job past GitHub's 6-hour limit.
[profile.ci-windows]
retries = 1
fail-fast = false
failure-output = "immediate-final"
# A hung test is stopped after 10 minutes instead of holding the job.
slow-timeout = { period = "60s", terminate-after = 10 }
# One line per test binary; add a test binary or a test name filter to run it on Windows.
