[test-groups]
# AppContainer profiles, Job objects and the Windows service are machine-wide, so the
# Windows-only binaries that create them never run concurrently.
windows-native = { max-threads = 1 }
# Child checkouts share one repository; these tests always ran one at a time on Windows.
isolated-subagents = { max-threads = 1 }

[[profile.ci-windows.overrides]]
filter = 'binary(/^windows_/) | binary(/_windows$/)'
test-group = "windows-native"

[[profile.ci-windows.overrides]]
filter = "binary_id(cyber-tools::isolated_subagents)"
test-group = "isolated-subagents"
